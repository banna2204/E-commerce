<div class="empty">
    <div *ngIf="isEmpty; else notEmpty">Cart is empty!!</div>
    <a *ngIf="isEmpty" [routerLink]="['/home']">Back to home</a>
</div>

<ng-template #notEmpty>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef> Title </th>
            <td mat-cell *matCellDef="let element"> {{element.title}} </td>
  </ng-container>

  <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef> Quantity </th>
      <td mat-cell *matCellDef="let element">
        <div class="quantity">
            <button class="btn" (click)="decreaseQuantity(element.id)">-</button>
            <div class="quantity-width">{{element.quantity}}</div>
            <button class="btn" (click)="increaseQuantity(element.id)">+</button>
        </div>
    </td>
    </ng-container>
    
    <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef> Price </th>
        <td mat-cell *matCellDef="let element" class="price-width">
             {{(element.price * element.quantity).toFixed(2)}} 
        </td>
    </ng-container>
    
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<div class="grand-total">
    <div>Total :</div><div class="ttl-margin">{{totalPrice.toFixed(2)}}</div>
</div>
</ng-template>
