<div class="flex-item">
    <div *ngFor="let product of products">
        <mat-card class="example-card" appearance="outlined">
          <mat-card-header>
            <mat-card-title class="font-title">{{product.title}} </mat-card-title>
          </mat-card-header>
          <img mat-card-image src={{product.image}} height="200">
          <mat-card-content class="price-margin">
            <p >price - {{product.price}} </p>
          </mat-card-content>
          <button (click)="addToCart(product.id)" mat-flat-button color="warn">Add to cart</button>
        </mat-card>
    </div>
</div>
